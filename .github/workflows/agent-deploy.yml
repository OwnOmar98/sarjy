name: agent-deploy

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "!agent/livekit.toml"
      - "!agent/README.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: agent-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Deploy LiveKit Cloud agent
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          # Injected into the running worker (not the deploy action itself)
          # — one entry per var agent/.env.example lists as required/optional.
          SECRET_LIST: "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},DATABASE_URL=${{ secrets.DATABASE_URL }},REDIS_URL=${{ secrets.REDIS_URL }}"
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: agent
