name: agent-deploy

# Agent worker is self-hosted on Fly.io (agent/fly.toml) — LiveKit Cloud
# Agents hosting is unusable there (every build failed at "exporting cache
# to registry" with "Image count limit exceeded: limit 100000" on LiveKit's
# own shared build-cache registry, not fixable from our side; reported to
# LiveKit support) and the LiveKit Cloud agent (CA_SKSUk3gKmmFQ) has been
# deleted.
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "!agent/livekit.toml"
      - "!agent/README.md"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: agent-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Sync secrets
        working-directory: agent
        run: |
          flyctl secrets set --stage \
            GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}" \
            ELEVENLABS_API_KEY="${{ secrets.ELEVENLABS_API_KEY }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            REDIS_URL="${{ secrets.REDIS_URL }}" \
            LIVEKIT_URL="${{ secrets.LIVEKIT_URL }}" \
            LIVEKIT_API_KEY="${{ secrets.LIVEKIT_API_KEY }}" \
            LIVEKIT_API_SECRET="${{ secrets.LIVEKIT_API_SECRET }}" \
            WEB_NOTIFY_URL="${{ vars.WEB_NOTIFY_URL }}" \
            WEB_NOTIFY_SECRET="${{ secrets.INTERNAL_NOTIFY_SECRET }}"
        # WEB_NOTIFY_URL is a repo *variable*, not a secret — it's a public
        # endpoint any browser already calls the app's own domain for, so
        # there's nothing confidential in it; the actual auth boundary is
        # WEB_NOTIFY_SECRET. Kept out of a literal here specifically
        # because this one's expected to change once the Cloudflare Worker
        # gets a custom domain — a variable update needs no code change.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        working-directory: agent
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
