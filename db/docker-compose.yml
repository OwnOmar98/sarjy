services:
  sarjy-postgres:
    container_name: sarjy-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      # 5533/6380 — chosen to avoid himam-nest (55432, 33306, 6381, 8082)
      # and Dallali's local Supabase stack (54391, 54393, 54394, 54399),
      # plus the currently-occupied system defaults (3306, 6379).
      - "5533:5432"
    environment:
      POSTGRES_DB: sarjy
      POSTGRES_USER: sarjy
      POSTGRES_PASSWORD: sarjy
    volumes:
      - sarjy-pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  sarjy-redis:
    container_name: sarjy-redis
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - sarjy-redis-data:/data

  sarjy-livekit:
    container_name: sarjy-livekit
    image: livekit/livekit-server
    restart: unless-stopped
    # --bind 0.0.0.0, not --dev's own loopback-only default — Docker's
    # port-mapping NAT can't reach a process bound to the container's own
    # 127.0.0.1. --keys pins the well-known dev key/secret agent/.env and
    # web/.env already expect, instead of a new random pair every
    # restart. A genuinely separate project from the deployed Fly.io
    # worker's shared LiveKit Cloud project — running the agent locally
    # used to register it as a worker against that same production job
    # queue and it could win a real call's dispatch, silently writing it
    # to local Postgres instead of prod Neon (confirmed live).
    command: ["--dev", "--bind", "0.0.0.0", "--keys", "devkey: secret"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  sarjy-pgdata:
  sarjy-redis-data:
