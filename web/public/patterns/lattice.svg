<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!--
    Mashrabiya lattice module — the direction's structural unit, not a
    decorative texture (see app.vue's direction-contract comment).
    Two constructed forms sharing one 100x100 cell:
    1. A diamond trellis (edge-midpoint to edge-midpoint) that tiles into
       a continuous connected lattice across repeats — the "bars".
    2. An 8-point star (union of an axis-aligned diamond and a 45°
       square, both centered) as the ornamental core of each cell.
    currentColor throughout so it inherits the caller's color/opacity.
  -->
  <path
    d="M50,0 L100,50 L50,100 L0,50 Z"
    fill="none"
    stroke="currentColor"
    stroke-width="1"
  />
  <path
    d="M50,5 L82,18 L95,50 L82,82 L50,95 L18,82 L5,50 L18,18 Z"
    fill="none"
    stroke="currentColor"
    stroke-width="1.25"
  />
</svg>
